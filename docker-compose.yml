services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ring-mosquitto
    restart: unless-stopped
    # Not published. The broker allows anonymous access, so exposing it would
    # let anyone on your network read and inject Ring topics. To point Home
    # Assistant at it, add:  ports: ["1883:1883"]  — and set a password first.
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/#' -C 1 -i healthcheck --quiet 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ring-mqtt:
    image: tsightler/ring-mqtt
    container_name: ring-mqtt
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/ring-mqtt-init.sh"]
    # Neither port is published. 8554 is the RTSP server, reached over the Docker
    # network by go2rtc and the recorder. 55123 is ring-mqtt's own token setup
    # UI, which has no authentication and is no longer needed — the Ring Off
    # setup wizard does the sign-in. To use it as a fallback, temporarily add:
    #   ports: ["55123:55123"]
    volumes:
      - ./data/ring-mqtt:/data
      - ./config/ring-mqtt-init.sh:/ring-mqtt-init.sh:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    logging:
      options:
        max-size: 10m
        max-file: "3"

  # ── Optional: live camera streaming ───────────────────────────────────────
  # Remove or comment out this service if you only need events and recordings.
  go2rtc:
    image: alexxit/go2rtc
    container_name: ring-go2rtc
    restart: unless-stopped
    ports:
      # WebRTC media — the browser connects here directly, so this one must be
      # reachable. Both protocols are required: without the UDP mapping the
      # browser can only fall back to TCP, and without TCP it cannot connect at
      # all when UDP is blocked.
      - "8555:8555/tcp"
      - "8555:8555/udp"
      # go2rtc's own UI and API stay internal; the webapp proxies what it needs.
      # Add "1984:1984" if you want to open the go2rtc UI directly.
    volumes:
      # Mount the directory, not the single file: if config/go2rtc.yaml does not
      # exist yet, a file bind-mount makes Docker silently create a *directory*
      # in its place. The webapp creates the file on first start.
      - ./config:/config:ro
    depends_on:
      ring-mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1984"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  webapp:
    image: ghcr.io/m4rcelnoel/ring-off-webapp:latest
    container_name: ring-webapp
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config                          # go2rtc.yaml (auto-discovery writes here)
      - ./data/ring-mqtt:/ring-mqtt-data
      - ./data/webapp:/app/data
      - ./data/videos:/videos                     # recordings browser
      # The Docker socket is NOT mounted. It is root-equivalent access to the
      # host, on the one container that parses input from a browser.
      #
      # It was used to restart ring-mqtt after a Ring sign-in and to restart
      # go2rtc when a camera was discovered. Neither is required any more:
      # go2rtc is updated over its REST API, and ring-mqtt retries authentication
      # by itself within about a minute, so setup just takes a little longer.
      #
      # Uncomment for an immediate restart instead of that wait:
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - GO2RTC_URL=http://go2rtc:1984
      - GO2RTC_WS_URL=ws://go2rtc:1984
      - GO2RTC_CONFIG=/config/go2rtc.yaml
      - GO2RTC_CONTAINER=ring-go2rtc
      - RING_CONTAINER=ring-mqtt
      - RING_MQTT_CONFIG=/ring-mqtt-data/config.json
      - RTSP_HOST=ring-mqtt
      - RTSP_PORT=8554
      - VIDEO_PATH=/videos
    depends_on:
      mosquitto:
        condition: service_healthy
      ring-mqtt:
        condition: service_started
      go2rtc:
        condition: service_healthy
        required: false

  # ── Optional: local video recording ───────────────────────────────────────
  # Remove or comment out this service if you don't want clips saved locally.
  recorder:
    image: ghcr.io/m4rcelnoel/ring-off-recorder:latest
    container_name: ring-recorder
    restart: unless-stopped
    volumes:
      - ./data/videos:/videos
      - ./data/webapp:/app/data:ro
      - ./data/ring-mqtt:/ring-mqtt-data:ro
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - RTSP_HOST=ring-mqtt
      - RTSP_PORT=8554
      - RING_MQTT_CONFIG=/ring-mqtt-data/config.json
      - VIDEO_PATH=/videos
      - SETTINGS_FILE=/app/data/settings.json
    depends_on:
      mosquitto:
        condition: service_healthy
      ring-mqtt:
        condition: service_started
